[workspace]
resolver = "2"
exclude = ["vendor/gpui_windows"]
members = [
    "crates/ferail-archive",
    "crates/ferail-core",
    "crates/ferail-design",
    "crates/ferail-disk-usage",
    "crates/ferail-fs-native",
    "crates/ferail-meta",
    "crates/ferail-ntfs",
    "crates/ferail-ntfs-win32",
    "crates/ferail-shell-mac",
    "crates/ferail-shell-win32",
    "crates/ferail-shell-linux",
    "crates/ferail-shell-aros",
    "crates/ferail-aros-app",
    "crates/ferail-video-mpv",
    "crates/ferail-gpui",
    "crates/dnd-lab",
]

[workspace.package]
version = "0.7.9"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
repository = "https://github.com/jonx/Ferail"
homepage = "https://github.com/jonx/Ferail"
authors = ["John Knipper <code@jkn.me>"]

[workspace.dependencies]
ferail-archive      = { path = "crates/ferail-archive" }
ferail-core         = { path = "crates/ferail-core" }
ferail-design       = { path = "crates/ferail-design" }
ferail-disk-usage   = { path = "crates/ferail-disk-usage" }
ferail-fs-native    = { path = "crates/ferail-fs-native" }
ferail-meta         = { path = "crates/ferail-meta" }
ferail-ntfs         = { path = "crates/ferail-ntfs" }
ferail-ntfs-win32   = { path = "crates/ferail-ntfs-win32" }
ferail-shell-mac    = { path = "crates/ferail-shell-mac" }
ferail-shell-win32  = { path = "crates/ferail-shell-win32" }
ferail-shell-linux  = { path = "crates/ferail-shell-linux" }
ferail-shell-aros   = { path = "crates/ferail-shell-aros" }
ferail-video-mpv    = { path = "crates/ferail-video-mpv" }

# Still needed by ferail-shell-mac for the winit-window-taking subset
# (begin_drag, show_context_menu, install_services_anchor, etc.), those
# functions are unreachable through the `platform_shell` alias today but
# kept for parity / a possible re-introduction; revisit when the shell
# surface is pruned.
winit       = "0.30"
anyhow      = "1"
rayon       = "1"

# UUIDs for favorite identity (stable across sessions, separate from NodeId).
uuid        = { version = "1", features = ["v4"] }

# Duplicate-finder hash funnel (docs/features/DUPLICATES.md): xxh3 for the
# cheap partial-hash filter, BLAKE3 for the full-content confirm. Ported by
# intent from Ferail's hash pipeline.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3      = "1"
# User-facing file verification (docs/features/CHECKSUMS.md). The worker
# feeds this incrementally, so even multi-gigabyte files stay bounded-memory.
sha2        = "0.10"
# Sidecar manifest interoperability (docs/features/SIDECARS.md). CRC32 is the
# SFV format; MD5/SHA-1 are verification-only legacy formats and are labelled
# weak in the UI. All implementations are pure Rust and stream incrementally.
crc32fast   = "1"
md-5        = "0.10"
sha1        = "0.10"

# Bulk-rename pattern rules (docs/features/BULK_RENAME.md): user-supplied
# find/replace patterns with $1..$9 capture refs. MIT/Apache-2.0: clean
# for the dual-licensed release.
regex       = "1"

# Status-bar app-footprint segment (docs/features/SYSTEM_STATS.md): process
# CPU / RSS / run-time sampling. `system` only, no disk/network/component
# probes. Same 0.31 line the graph already carries via zed-scap, so this
# adds no second copy.
sysinfo     = { version = "0.31", default-features = false, features = ["system"] }

# Media tags (docs/features/MEDIA-TAGS.md): one parser for ID3v1/v2 (mp3 +
# WAV/AIFF chunks), MP4 atoms, Vorbis comments (flac/ogg/opus), and APE:
# tags, audio properties, and embedded cover art. Pure Rust, MIT/Apache-2.0.
# Its MSRV (1.85) is what set this workspace's rust-version.
lofty       = "0.24"
# Native filesystem timestamp writes used by Get Info. Patched below to the
# in-repo AROS-aware copy, so every target resolves the same implementation.
filetime    = "0.2"

# External: new stack (ferail-gpui).
#
# Pinning strategy: GPUI comes from the `gpui-pre-*` crates.io snapshots
# of Zed (renamed back to `gpui`, `gpui_platform`, `reqwest_client` here),
# and gpui-component from its crates.io release. Every pin is exact (`=`):
# each gpui-component release compiles against exactly one snapshot, and
# any snapshot may change GPUI's API. Bump them together, to the snapshot
# the gpui-component release declares in its own workspace Cargo.toml
# (`gpui = { package = "gpui-pre", version = "=…" }`); a mismatch puts two
# incompatible GPUIs in the graph (see docs/GPUI-UPSTREAM.md §1).
# test-support: enables `Window::render_to_image` + the matching impl
# in `gpui_macos` so the headless screenshot CLI in ferail-gpui works.
# test-support is NOT enabled here: it drags in gpui's leak-detection,
# whose exit assertion must never ship to users (the 0.6.5 tester's
# "crashes" were that assert firing at quit). Dev/test builds get it back
# through ferail-gpui's default `screenshot-harness` feature; packaging
# builds pass --no-default-features to strip it.
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["profiler"] }
# wayland + x11 enable gpui_linux's compositor backends (gpui_platform's
# wayland/x11 features pull gpui_linux/wayland|x11). Without them the Linux
# build compiles but panics at startup: guess_compositor() returns "Wayland"
# and hits the unreachable arm. No-op on macOS/Windows (gpui_linux is
# Linux-only there).
# runtime_shaders compiles the Metal shaders at launch instead of at build
# time, so building does not need Xcode's `metal` compiler.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
# Real HTTP for gpui's `cx.http_client()` (gpui itself installs a
# NullHttpClient). Same snapshot as gpui. Powers the update check
# (docs/features/UPDATES.md).
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }
# `tree-sitter-languages` pulls in the full tree-sitter grammar set so
# the preview pane's TextView highlights fenced code blocks (and
# markdown code) for every language (docs/features/PREVIEW.md). Each
# grammar is a C-compiled crate: a real but one-time build cost.
gpui-component = { version = "=0.7.1", features = ["tree-sitter-languages"] }
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.7.1" }
gpui-fps = { version = "=0.7.1" }

# `tar` gates its path<->bytes conversion, symlink, permission and xattr
# helpers on cfg(unix)/cfg(windows)/wasm32, and AROS is none of those: the
# crate simply does not compile for the target. `vendor/tar` is upstream
# 0.4.46 plus AROS arms; byte-identical behaviour everywhere else, so unlike
# the sibling-checkout patches this one is safe (and required) on every
# platform and stays in the shared manifest. See vendor/tar/README.md.
[patch.crates-io]
# GPUI promotes native file drags on macOS/Wayland, but its Windows backend
# leaves the platform hooks disabled. This narrow Apache-2.0 fork adds the
# missing Shell/OLE handoff; see vendor/gpui_windows/README.md.
gpui-pre-windows = { path = "vendor/gpui_windows" }
tar = { path = "vendor/tar" }
# The legacy Objective-C `block` crate still sits below cocoa/metal in GPUI's
# macOS graph. Its empty-enum declaration for `_NSConcreteStackBlock` triggers
# Rust's `uninhabited_static` future error. This byte-for-byte API-compatible
# copy uses block2's inhabited ABI model; see vendor/block/README.md.
block = { path = "vendor/block" }

# Same story, same reason: upstream has no AROS arm and the crate does not
# compile for the target. Both are copies of zed-aros/vendor-aros (whose AROS
# work these are), kept here so Ferail's build does not depend on a sibling
# checkout for something every platform links.
#
# `filetime` is patched **globally** rather than only from the AROS config on
# purpose. A version-differing patch that is only present for AROS
# invocations goes silently inert the moment any host `cargo` command
# re-resolves the lock to a newer registry version: cargo will not downgrade
# to a patch, it just drops it, and the AROS build then fails with the
# original "no libc for this target" errors. Patching here means the vendored
# copy is the only filetime any build can see, on any target.
#
# `stacker` is no longer in the standard GPUI graph. The older AROS GPUI fork
# still needs its no-op AROS implementation, supplied by the AROS-only cargo
# config, so normal builds should not carry an unused global patch for it.
# filetime (via notify): unix/windows/wasm arms only; the AROS arm reads times
# from std Metadata and reports set-times unsupported.
filetime = { path = "vendor/filetime" }

# NOTE: the AROS `[patch]` entries deliberately do NOT live here.
#
# The AROS port needs four source overrides (gpui, gpui_platform,
# gpui-component[-assets], plus AROS-only source shims) that resolve to
# **sibling checkouts**: `../zed-aros`, `../gpui-component-aros`. Unlike the
# in-repo path above, a *sibling* path in this shared manifest is a hard
# requirement on every machine that builds the repo: cargo resolves `[patch]`
# before it does anything else, so a missing sibling is not a degraded build, it
# is an instant manifest error ("failed to read
# ../zed-aros/vendor-aros/filetime/Cargo.toml") on macOS, Windows, Linux, and CI
# alike. That broke every clean clone of `main`.
#
# Cargo honours `[patch]` in `.cargo/config.toml` identically, and that path is
# already gitignored as per-machine config. AROS builders copy the template:
#
#     cp packaging/aros/cargo-config-aros.toml .cargo/config.toml
#
# See docs/features/aros-building.md § "Checkout layout". Keep this manifest free
# of paths that are not committed inside the repo.

[profile.dev]
# Text rasterization is sluggish at -Copt-level=0: keep some optimization in dev.
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
# Unwind (not abort) so GPUI's per-frame `catch_unwind` can absorb a stray
# paint/event panic and keep the window alive: the prime directive ("the UI
# must never stop") outweighs the small size win of aborting. The obs panic
# hook still prints a crash report either way.
panic = "unwind"
strip = true
