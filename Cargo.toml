[workspace]
resolver = "2"
members = [
    "crates/feraille-core",
    "crates/feraille-design",
    "crates/feraille-disk-usage",
    "crates/feraille-fs-native",
    "crates/feraille-meta",
    "crates/feraille-shell-mac",
    "crates/feraille-shell-win32",
    "crates/feraille-gpui",
]

# The old soft-renderer stack (`feraille-app`, `feraille-render`,
# `feraille-controls`) lives under `crates/_archive/` and is **not** a
# workspace member. It compiled and shipped through the GPUI migration
# as reference / fallback; nothing in the active workspace depends on
# it. Restore by moving back into `crates/` and re-adding to `members`.

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
feraille-core         = { path = "crates/feraille-core" }
feraille-design       = { path = "crates/feraille-design" }
feraille-disk-usage   = { path = "crates/feraille-disk-usage" }
feraille-fs-native    = { path = "crates/feraille-fs-native" }
feraille-meta         = { path = "crates/feraille-meta" }
feraille-shell-mac    = { path = "crates/feraille-shell-mac" }
feraille-shell-win32  = { path = "crates/feraille-shell-win32" }

# Still needed by feraille-shell-mac for the winit-window-taking subset
# (begin_drag, show_context_menu, install_services_anchor, etc.) — those
# functions are unreachable through the `platform_shell` alias today but
# kept for parity / a possible re-introduction; revisit when the shell
# surface is pruned.
winit       = "0.30"
# softbuffer / ab_glyph used to belong to the soft-renderer stack and are
# unreferenced by anything in the active workspace today. Left declared
# in case the archived crates are restored.
softbuffer  = "0.4"
ab_glyph    = "0.2"
anyhow      = "1"

# UUIDs for favorite identity (stable across sessions, separate from NodeId).
uuid        = { version = "1", features = ["v4"] }

# External — new stack (feraille-gpui).
#
# Pinning strategy: `gpui-component` is pinned to a specific rev (it
# is our higher-level coupling and we want updates to be deliberate).
# `gpui` itself is left *URL-identical* to how gpui-component declares
# it (no rev) — adding `rev = "..."` makes cargo treat our pin as a
# *different source* from gpui-component's unpinned gpui, ending up
# with two gpuis in the graph. Reproducibility comes from committing
# `Cargo.lock`; see CHANGELOG-DEPS.md for the locked revs at any
# point in time.
# test-support: enables `Window::render_to_image` + the matching impl
# in `gpui_macos` so the headless screenshot CLI in feraille-gpui works.
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "test-support"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "ba44512e0cfe633869714054e8ea1afd133d4a28" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "ba44512e0cfe633869714054e8ea1afd133d4a28" }

# =============================================================================
# LOCAL-ONLY PATCH — DO NOT COMMIT
# =============================================================================
# Temporary override pointing at a local clone of zed-industries/zed with an
# in-progress `gpui_windows::render_to_image` patch (branch
# `gpui-windows-render-to-image`). Used to verify the upstream change works
# end-to-end with feraille's screenshot harness before opening the PR.
#
# Remove this entire `[patch]` block before pushing the feraille branch —
# the relative `../zed` path only exists on this dev machine, so leaving it
# in would break every other build (notably Mac, which has its own working
# `render_to_image` and doesn't need this patch at all).
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../zed/crates/gpui" }
gpui_platform = { path = "../zed/crates/gpui_platform" }
gpui_windows = { path = "../zed/crates/gpui_windows" }

[profile.dev]
# Text rasterization is sluggish at -Copt-level=0 — keep some optimization in dev.
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
