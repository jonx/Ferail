# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#
# Purpose (TODO.md → Open-Source Release): catch license / advisory drift
# mechanically — in particular a future `gpui` rev bump that changes the
# transitive license surface. Run with:
#
#   cargo deny check licenses advisories
#
# The one known copyleft edge is documented in THIRD-PARTY-NOTICES.md:
# `gpui → sum_tree → ztracing/zlog` are GPL-3.0 zed crates. Publishing
# SOURCE is unaffected; a redistributable BINARY must first sever that
# edge (patch sum_tree; upstream zed#55470). The exceptions below pin
# the allowance to exactly those crates so anything NEW that is GPL
# fails the check instead of sliding in silently.

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "NCSA",
    "bzip2-1.0.6",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
]
# The documented zed GPL edge — see the header. Keep this list EXACT:
# a new GPL dependency must fail the check, not inherit the exception.
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "ztracing" },
    { allow = ["GPL-3.0-or-later"], crate = "ztracing_macro" },
    { allow = ["GPL-3.0-or-later"], crate = "zlog" },
]

[advisories]
yanked = "warn"
# Every entry below arrives transitively through the PINNED upstream
# revs (gpui / gpui-component) and cannot be fixed from this workspace —
# they clear only when the upstream pins bump. Listed individually (not
# blanket-silenced) so anything NEW still fails the check. Re-audit
# this list on every gpui/gpui-component rev bump.
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained (transitive)
    "RUSTSEC-2024-0384", # instant unmaintained (transitive)
    "RUSTSEC-2024-0436", # paste unmaintained (transitive)
    "RUSTSEC-2025-0052", # async-std discontinued (gpui)
    "RUSTSEC-2025-0134", # proc-macro-error2 unmaintained (transitive)
    "RUSTSEC-2026-0173", # anyhow downcast_mut unsoundness (upstream pin)
    "RUSTSEC-2026-0190", # transitive unmaintained via upstream pin
    "RUSTSEC-2026-0192", # transitive unmaintained via upstream pin
    "RUSTSEC-2026-0194", # transitive unmaintained via upstream pin
    "RUSTSEC-2026-0195", # transitive unmaintained via upstream pin
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
