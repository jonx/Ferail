name: Docs

# CI skips documentation-only pushes, so the documentation gets its own cheap
# leg: link and anchor resolution, generated tables of contents, WIN-nnn
# identifiers, feature-note navigation lines, and index membership.
on:
  push:
    branches: [main]
    paths: ["**.md", "scripts/check-docs.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**.md", "scripts/check-docs.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: check-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check-docs
        run: python3 scripts/check-docs.py
