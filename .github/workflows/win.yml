# Build the Windows portable ZIP via scripts/package-win.ps1 — the same script
# a local Windows box would run, so CI and hand-built artifacts stay identical.
# The build is UNSIGNED (no Authenticode cert in CI; see the SmartScreen note
# in README.md § Windows) — publish the ZIP's SHA-256 with the release so
# downloads are at least verifiable.
#
# On a `v*` tag the ZIP is attached to that tag's GitHub release, same
# contract as deb.yml. A temporary `retry-v*` tag rebuilds and attaches to the
# corresponding `v*` release; this is the recovery path when a tag run fails
# after GitHub has already recorded it. Manual dispatch leaves the build as a
# run artifact.
name: Windows packages

on:
  push:
    tags: ["v*", "retry-v*"]
  workflow_dispatch:

concurrency:
  group: win-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  zip:
    name: win-x64 portable + installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # aws-lc-sys (rustls' default crypto provider, via the update check's
      # reqwest_client) assembles with NASM on Windows MSVC; the runner
      # image doesn't ship it.
      - name: Install NASM (aws-lc-sys)
        run: choco install nasm -y --no-progress; echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build portable ZIP and installer
        shell: pwsh
        run: ./scripts/package-win.ps1

      # The second glob picks up Ferail-<version>-x64-symbols.zip — the
      # PDB bundle whose manifest ties CodeView identity to this commit, so
      # tester crash dumps stay symbolizable. Ship it with every release.
      # Its name deliberately lacks "win": updaters up to 0.6.6 grab the
      # first *win*.zip asset, and the symbols bundle sorts first.
      - name: SHA-256
        shell: pwsh
        run: Get-FileHash target/package/Ferail-*-win-x64.zip, target/package/Ferail-*-win-x64-setup.exe, target/package/Ferail-*-x64-symbols.zip -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: ferail-win-x64
          path: |
            target/package/Ferail-*-win-x64.zip
            target/package/Ferail-*-win-x64-setup.exe
            target/package/Ferail-*-x64-symbols.zip
          if-no-files-found: error

      - name: Resolve release tag
        if: github.ref_type == 'tag'
        id: release
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -match '^retry-(v\d+\.\d+\.\d+)(?:-.+)?$') {
            $tag = $Matches[1]
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            throw "invalid release target: $tag"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The release title comes from the notes' H1 ("Ferail <v> — …") so
      # automated releases match the hand-titled ones in the release list —
      # without this, action-gh-release names the release after the bare tag
      # (v0.6.6 and v0.6.7 shipped that way and were retitled by hand).
      - name: Release title from the notes
        if: github.ref_type == 'tag'
        id: title
        shell: pwsh
        run: |
          $h1 = (Get-Content RELEASE_NOTES.md -TotalCount 1) -replace '^#\s*', ''
          "title=$h1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.title.outputs.title }}
          body_path: RELEASE_NOTES.md
          files: |
            target/package/Ferail-*-win-x64.zip
            target/package/Ferail-*-win-x64-setup.exe
            target/package/Ferail-*-x64-symbols.zip
