name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "screenshots/**"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "screenshots/**"]
  # Weekly tick for the expensive `app` job only (see its note); the cheap
  # jobs skip scheduled runs.
  schedule:
    - cron: "0 6 * * 1"
  # Manual "run everything now", including `app`.
  workflow_dispatch:

# A newer push supersedes an in-flight run of the same kind: fewer billed
# minutes, and a burst of pushes on a broken tree produces at most one
# failure notification instead of one per push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Restored 2026-08-07 from commit 6d85def (removed in a2fbb44 during release
# prep). Three deliberate changes from that version, all driven by the repo
# being PRIVATE right now (macOS runner minutes bill 10x, Windows 2x; public
# repos run free):
#
#   - The platform matrix has no macos leg. It would cost ~10x the other two
#     legs combined and guards the one platform that gets built locally every
#     day. When the repo goes public, add
#     `{ os: macos-latest, shell_crate: ferail-shell-mac }` to the matrix.
#   - `app` (the ~7 GB windows ferail-gpui build) runs weekly + on manual
#     dispatch instead of on every push. When the repo goes public, drop its
#     `if:` to move it back to push.
#   - Docs-only pushes skip CI entirely (paths-ignore above).
#
# CI scope note: the `ferail-gpui` app crate pulls gpui (zed, via git),
# gpui-component, and ~30 tree-sitter grammars — a `cargo check --all-targets`
# of it produces a ~7 GB target dir and a long cold build, so it gets its own
# job with caching rather than riding along with the fast checks.
#
# The `platform` job exists because of a concrete incident: commit 6c12fe8
# (Mac-authored) added a `cfg(windows)`-only `IMFMediaEngine::SetMuted` call
# that could not compile, and it sat broken on main for two weeks. Nothing in
# CI built for Windows, and a Mac `cargo check` builds shell-win32's
# `cfg(not(windows))` no-op arms instead of the real ones — so the breakage was
# structurally invisible. The platform shell crates are cheap (no gpui in their
# graph: ferail-core + windows + zip), which makes per-OS coverage of exactly
# that failure mode nearly free. See docs/features/windows-port.md § 8.
jobs:
  logic:
    name: check + test (platform-neutral crates)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test -p ferail-core -p ferail-disk-usage -p ferail-design

      - name: clippy
        run: cargo clippy -p ferail-core -p ferail-disk-usage -p ferail-design --all-targets -- -D warnings

  platform:
    name: platform crates (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell_crate: ferail-shell-win32
          - os: ubuntu-latest
            shell_crate: ferail-shell-linux
          # macos-latest is deliberately absent while the repo is private:
          # 10x billed minutes, and macOS is the daily driver so breakage
          # there is noticed locally in minutes. When the repo goes public,
          # add { os: macos-latest, shell_crate: ferail-shell-mac }.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # The real per-OS arms only compile on their own host: on any other host
      # cargo builds the crate's no-op fallback arms, which proves nothing.
      # ferail-fs-native carries the cfg-gated filesystem arms (icons, trash,
      # volumes, quarantine) and is the other place Mac-authored commits touch
      # Windows/Linux code blind.
      - name: cargo check
        run: cargo check -p ${{ matrix.shell_crate }} -p ferail-fs-native -p ferail-meta -p ferail-archive --all-targets

      - name: cargo test
        run: cargo test -p ${{ matrix.shell_crate }} -p ferail-fs-native -p ferail-archive

      # Windows-only for now: the zero-warning state was verified on a real
      # Windows host. Enable this for ubuntu/macos once someone has confirmed
      # those hosts are clean too — turning the gate on blind would just paint
      # CI red on pre-existing warnings nobody has looked at.
      - name: clippy
        if: matrix.os == 'windows-latest'
        run: cargo clippy -p ${{ matrix.shell_crate }} -p ferail-fs-native --all-targets -- -D warnings

  # Windows only, deliberately. This job is the expensive one — a cold build of
  # ferail-gpui pulls gpui + ~30 tree-sitter grammars and lands around 7 GB —
  # and the risk it covers is asymmetric: macOS is the daily driver, so a break
  # there is noticed within minutes, whereas the `SetMuted` breakage this job
  # exists to prevent sat on main for two weeks precisely because nobody runs
  # Windows day to day. Weekly + manual while the repo is private (2x billed
  # minutes would dominate the budget on every push); drop the `if:` to run it
  # on push once the repo is public.
  app:
    name: app crate (windows)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # No `-D warnings` here on purpose. `clippy::disallowed_methods` is a
      # crate-level `deny` (ferail-gpui/Cargo.toml [lints.clippy]), so the
      # Prime Directive tripwire still fails the build on its own — but the
      # app crate currently carries ~25 pre-existing style warnings, and
      # gating on those would just wedge CI on work unrelated to the change
      # under review. Add `-- -D warnings` once the crate is clean.
      #
      # The real value of running this per-OS is catching platform_shell
      # surface drift between the shell crates, and compile errors in
      # `cfg(windows)`/`cfg(target_os = "macos")` arms that only exist on
      # their own host.
      - name: clippy (also covers check)
        run: cargo clippy -p ferail-gpui --all-targets
