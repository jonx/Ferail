[package]
name = "feraille-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Feraille — macOS file explorer (binary)"

[[bin]]
# Capitalised so macOS shows "Feraille" in the menu bar / About / dock
# tooltip. Without an .app bundle, NSApplication uses the executable
# basename as the process name; lowercase looked unprofessional.
name = "Feraille"
path = "src/main.rs"

[dependencies]
feraille-core.workspace = true
feraille-design.workspace = true
feraille-render.workspace = true
feraille-controls.workspace = true
feraille-disk-usage.workspace = true
feraille-fs-native.workspace = true
feraille-shell-mac.workspace = true
feraille-shell-win32.workspace = true

winit.workspace = true
softbuffer.workspace = true
anyhow.workspace = true
png = "0.17"
