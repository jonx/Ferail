[package]
name = "feraille-shell-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux platform shell: freedesktop / D-Bus / XDG integration (stubbed)"

[dependencies]
feraille-core.workspace = true

# compress_paths writes `.zip` archives. Pure-Rust, cross-platform, and the
# logic is platform-neutral — so it (and its test) compile and run on any host,
# mirroring feraille-shell-win32's identical use. Same major/features as win32.
zip = { version = "2", default-features = false, features = ["deflate"] }

# NOTE: the remaining Linux-specific shell work (clipboard, trash, thumbnails,
# the dark/volume/power observers, video) will pull `ashpd`/`zbus`/`gstreamer`,
# etc. — see docs/features/linux-port.md §6 for the mechanism each maps to. Add
# those under `[target.'cfg(target_os = "linux")'.dependencies]` so the crate
# keeps compiling on macOS/Windows as a workspace member.
