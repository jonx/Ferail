[package]
name = "ferail-gpui"
version.workspace = true
license.workspace = true
repository.workspace = true
# GPUI requires edition 2024 (and Rust >= 1.85). The rest of the
# workspace is on 2021 / 1.78 — we keep the new crate's edition
# explicit so the rest of the workspace doesn't have to bump.
edition = "2024"
rust-version = "1.85"
publish = false

# "aros" is a custom-JSON target (branch aros-port); register its target_os
# value so host builds don't warn on the platform_shell alias' cfg arm.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("aros"))']

# Prime Directive enforcement (docs/ARCHITECTURE.md#prime-directive):
# the workspace-root clippy.toml disallows the syscalls most likely to
# freeze the UI thread (canonicalize, blocking process waits, raw
# notify watch registration). Denied here — in the UI crate — so every
# use must either go through the sanctioned wrapper or carry a visible
# `#[allow(clippy::disallowed_methods)]` with a why-this-is-off-thread
# justification. Run `cargo clippy -p ferail-gpui` before finishing.
[lints.clippy]
disallowed_methods = "deny"

[features]
# Compile in the optional mpv video provider (libmpv, loaded at runtime from
# the path set in Settings). Off by default so a stock build needs nothing.
mpv = ["dep:ferail-video-mpv"]

[dependencies]
anyhow.workspace = true
# Bridge gpui's `.log_err()` (the `log`-crate facade) into the AROS MacRW
# diagnostic sink — see obs.rs. On booted AROS nothing installs a `log`
# backend, so those swallowed failures (e.g. `paint_svg`) vanish. Same major
# as gpui_util's transitive use, so we stay single-copy in the graph.
log = "0.4"
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
# Phase 1 (next-level plan): bundle our own SVG icons alongside
# the upstream gpui-component icon pack. Same major as the upstream
# crate uses so we stay single-copy in the graph.
# `debug-embed`: without it rust-embed reads assets from the host filesystem
# (CARGO_MANIFEST_DIR) at runtime in debug builds instead of embedding them.
# That path doesn't exist inside booted AROS, so every icon SVG lookup returned
# None and no chrome/nav glyph drew. rust-embed is feature-unified across the
# graph, so this one flag also makes gpui_component_assets embed. The AROS
# `C:Ferail` is a debug build; this is what puts the SVG bytes in the binary.
rust-embed = { version = "8.7", features = ["interpolate-folder-path", "include-exclude", "debug-embed"] }
# Phase 5.b: file-system change events. notify ships its own
# platform-specific watcher (FSEvents on macOS, inotify on Linux,
# ReadDirectoryChangesW on Windows). Pinned to the same major as
# gpui-component's transitive use to keep one copy in the graph.
notify = "7.0"
# Streaming directory enumeration sends worker batches to a GPUI task
# without timer polling.
async-channel = "2.5"
# Status-bar app-footprint segment: samples this process's CPU / RSS on the
# background executor (docs/features/SYSTEM_STATS.md).
sysinfo.workspace = true
# Used to build the smallvec ExternalPaths expects for OS drag-out.
smallvec = "1"
# Wraps RGBA byte buffers we pull from NSWorkspace into a Frame the
# gpui RenderImage type accepts. gpui-component pulls the same major
# transitively, so this stays single-copy in the graph. The raster
# decode features beyond `png` feed the viewer window's full-res
# loader (docs/features/VIEWER.md); non-raster formats fall back to
# Quick Look thumbnails.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# SIMD-accelerated resampler for the viewer's still upscale (x2/x4). The
# `image` crate's `imageops::resize` is single-threaded with no SIMD, so a
# Lanczos3 enlargement to the 8192 px cap stalled the UI for seconds; this
# does the same Lanczos3 convolution with SSE4.1/AVX2/NEON. MIT OR Apache-2.0,
# minimal deps — clean for the dual-licensed release.
fast_image_resize = "5"
# The issue reporter bundles the diagnostics report + activity trail + a
# (redacted) screenshot into a `.zip`. Same major/features as the shell crates'
# compress_paths so the graph holds a single zip.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Used by the --screenshot harness on Windows to pull the HWND out of
# gpui::Window (which implements HasWindowHandle). Same major as
# gpui's transitive use so we stay single-copy in the graph.
raw-window-handle = "0.6"
# Breadcrumb path autocomplete implements gpui-component's
# LSP-flavoured CompletionProvider, whose item types come from
# lsp-types. Same version as gpui-component's so the trait's types
# unify (it only re-exports Position).
lsp-types = "0.97.0"
# Bulk-rename find/replace rules (docs/features/BULK_RENAME.md).
regex.workspace = true

# Domain wiring. ferail-gpui consumes the domain layer through the
# domain crates' trait surface; they link directly.
ferail-core.workspace = true
ferail-fs-native.workspace = true
# Harvest Stage 0: link the remaining domain crates. Even when
# their consumers haven't landed yet (e.g. ferail-meta is wired
# in Stage 1, disk-usage in Stage 7), declaring them here means a
# single `cargo check` from now on confirms the dep graph remains
# clean as the harvest proceeds.
ferail-design.workspace = true
ferail-meta.workspace = true
ferail-disk-usage.workspace = true
ferail-archive.workspace = true

# Platform shell — one impl per target OS. The crate's `pub fn`
# surface mirrors between the two so `crate::platform_shell` (in
# `lib.rs`) can alias them with a single `#[cfg]` switch; gpui call
# sites use `platform_shell::*` and don't care which is active.
# Optional mpv video provider (enabled by the `mpv` feature). libmpv is
# loaded at runtime on every desktop OS, so the dep is declared per-target
# alongside each platform's shell crate.
[target.'cfg(target_os = "macos")'.dependencies]
ferail-shell-mac.workspace = true
ferail-video-mpv = { workspace = true, optional = true }

# Freeze diagnostics (src/watchdog.rs): self-pipe kill-signal interception,
# and on Linux the prctl(PR_SET_PTRACER) window that lets the stack-capture
# tool attach. Same 0.2 the graph already carries transitively.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
ferail-shell-win32.workspace = true
ferail-video-mpv = { workspace = true, optional = true }
# Freeze diagnostics (src/watchdog.rs): SetConsoleCtrlHandler so Ctrl+Break /
# Ctrl+C on a frozen console-launched app still writes a hang report. Same
# 0.59 as the graph's existing transitive copy.
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
ferail-shell-linux.workspace = true
ferail-video-mpv = { workspace = true, optional = true }

# AROS (branch aros-port): the shell-linux stub scaffold re-exported under
# the AROS name. No mpv — libmpv has no AROS build, so the `mpv` feature
# stays a no-op there.
[target.'cfg(target_os = "aros")'.dependencies]
ferail-shell-aros.workspace = true

# Windows-only build script that embeds resources/ferail.ico and a
# VERSIONINFO block into the .exe. On non-Windows the build script
# is a no-op and this dep isn't pulled in.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Phase 2 isolation test still lives here. It now ALSO doubles as a
# guarantee that the domain types stay dyn-safe — Phase 4 relies on
# `Box<dyn FsBackend>` working.
ferail-core.workspace = true
ferail-fs-native.workspace = true
# assets test: rasterize every bundled chrome SVG through the same usvg/resvg
# path gpui uses, to catch malformed/empty glyphs that silently don't draw.
# Already in the compiled graph (via gpui), so this adds no build cost.
resvg = "0.45"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferail-gpui"
path = "src/main.rs"

[[bin]]
name = "ferail"
path = "src/bin/ferail.rs"

# Debian/Ubuntu packaging (cargo-deb). Build on a Linux host — the oldest
# Ubuntu LTS you want to support, since the produced .deb inherits that
# glibc floor — with:
#
#   cargo install cargo-deb
#   cargo deb -p ferail-gpui
#
# Ships the `ferail` bin (same program as `ferail-gpui`, see src/bin/
# ferail.rs) plus the freedesktop identity assets. The .desktop basename,
# the hicolor icon name, and the app_id every window sets (lib.rs
# `APP_ID`) must all stay "ferail" — compositors match them by string.
[package.metadata.deb]
name = "ferail"
# Compile the mpv video provider into the packaged binary. It dlopens the
# system libmpv.so.2 at runtime (never linked, never bundled — the GPL
# Homebrew/distro build stays out of this MIT/Apache package) and falls
# back to the native player when absent; libmpv2 rides in Recommends below.
features = ["mpv"]
maintainer = "John Knipper <code@jkn.me>"
copyright = "John Knipper <code@jkn.me>"
section = "utils"
priority = "optional"
# $auto = dpkg-shlibdeps at `cargo deb` time; it only sees *linked*
# libs (libc, xcb, xkbcommon). gpui dlopens Vulkan and libwayland at
# runtime, so those must be spelled out or the app dies on a minimal
# install. Only works on a Debian-family build host — which is the only
# place a .deb build makes sense anyway.
depends = "$auto, libvulkan1, libwayland-client0, libwayland-cursor0"
# Tools the Linux shell layer execs at runtime; everything degrades
# gracefully without them (see ferail-shell-linux), hence Recommends:
#   xdg-utils            xdg-open / xdg-mime (open, reveal fallback, MIME)
#   udisks2              udisksctl (eject / power-off removable drives)
#   libgdk-pixbuf2.0-bin gdk-pixbuf-thumbnailer (thumbnail generation)
#   libglib2.0-bin       gio (Open With launch)
#   shared-mime-info     the MIME database icons/Open With resolve against
#   mesa-vulkan-drivers  a Vulkan implementation for the common case
#                        (Recommends, not Depends: vendor drivers count too)
#   libmpv2              the mpv video provider dlopens libmpv.so.2 at
#                        runtime; without it the viewer's native player
#                        still works, so Recommends, not Depends
recommends = "xdg-utils, udisks2, libgdk-pixbuf2.0-bin, libglib2.0-bin, shared-mime-info, mesa-vulkan-drivers, libmpv2"
extended-description = """\
Fast, keyboard-friendly file manager built on GPUI. Virtualized file \
listings, magic-byte format detection, previews and thumbnails, an async \
disk-usage treemap, archive browsing and extraction, favorites, tabs and \
multi-window — with all filesystem and shell work kept off the UI thread."""
assets = [
    ["target/release/ferail", "usr/bin/", "755"],
    ["resources/linux/ferail.desktop", "usr/share/applications/", "644"],
    ["resources/ferail.png", "usr/share/icons/hicolor/512x512/apps/ferail.png", "644"],
]
