[package]
name = "ferail-shell-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows shell integration: namespace, IContextMenu, drag-drop, change notifications"

[dependencies]
ferail-core.workspace = true

# compress_paths writes Explorer-style .zip archives. Pure-Rust, no
# extra C deps. Same major used elsewhere in the Rust ecosystem.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# The `#[implement]` macro (IMFMediaEngineNotify COM callback in video_mf)
# expands to `::windows_core::` paths, so windows-core must be a direct dep.
# Same major as `windows` below.
windows-core = "0.58"
# Microsoft's official Win32 bindings. Features are pulled per-call-site
# rather than enumerated up-front; tighten / prune once the surface
# settles.
windows = { version = "0.58", features = [
    # implementing the IMFMediaEngineNotify COM callback (video_mf)
    "implement",
    # show_alert → MessageBoxW
    "Win32_UI_WindowsAndMessaging",
    # prevent_idle_sleep → SetThreadExecutionState
    "Win32_System_Power",
    # system_is_dark → registry read
    "Win32_System_Registry",
    "Win32_Foundation",
    # copy_to_clipboard → Open/Set/Close clipboard + GlobalAlloc
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # fetch_quick_look_thumbnail → SHCreateItemFromParsingName +
    # IShellItemImageFactory + GDI GetDIBits; SHGetFileInfoW (read_shell_info);
    # eject_volume → CreateFileW + FILE_SHARE_* + OPEN_EXISTING
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Storage_FileSystem",
    # CreateFileW's SECURITY_ATTRIBUTES param
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    # IPreviewHandler fallback (preview_handler.rs)
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_Xps",
    # eject_volume → CreateFileW(\\.\X:) + DeviceIoControl(FSCTL_DISMOUNT/
    # IOCTL_STORAGE_EJECT_MEDIA)
    "Win32_System_Ioctl",
    "Win32_System_IO",
    # video_overlay_* → IMFMediaEngine frame-server + D3D11 readback
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # run_elevated_self → ShellExecuteExW runas + wait; processes_using /
    # force_close_processes → Restart Manager + OpenProcess/TerminateProcess
    "Win32_System_RestartManager",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
# Used by examples/thumb.rs to dump the extracted thumbnail to disk
# so we can eyeball it without launching the GUI.
image = { version = "0.25", default-features = false, features = ["png"] }
