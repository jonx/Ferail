[package]
name = "ferail-ntfs-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows raw-volume reader and helper boundary for Ferail Fast NTFS"

[dependencies]
ferail-ntfs.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "ferail-ntfs-diag"
path = "src/bin/diag.rs"

[[bin]]
name = "ferail-ntfs-helper"
path = "src/bin/helper.rs"

[[bin]]
name = "ferail-ntfs-client-diag"
path = "src/bin/client_diag.rs"
