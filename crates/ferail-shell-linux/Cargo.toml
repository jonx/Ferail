[package]
name = "ferail-shell-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux platform shell: freedesktop / D-Bus / XDG integration (stubbed)"

[dependencies]
ferail-core.workspace = true

# compress_paths writes `.zip` archives. Pure-Rust, cross-platform, and the
# logic is platform-neutral - so it (and its test) compile and run on any host,
# mirroring ferail-shell-win32's identical use. Same major/features as win32.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Linux-only shell deps. Kept under cfg(target_os = "linux") so the crate still
# compiles on macOS/Windows as a workspace member (the cfg(not(linux)) stub arms).
[target.'cfg(target_os = "linux")'.dependencies]
# copy_to_clipboard - plain-text clipboard over Wayland + X11.
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.11.0"
wl-clipboard-rs = "0.9"
url = "2"
async-channel = "2"
libc = "0.2"
zbus = "5"
