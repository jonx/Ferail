[package]
name = "feraille-aros-app"
version.workspace = true
license.workspace = true
repository.workspace = true
# Edition 2024 to match feraille-gpui (and the `unsafe(no_mangle)` /
# `unsafe extern` syntax used in lib.rs).
edition = "2024"
rust-version = "1.85"
publish = false

# The AROS entry point: a staticlib the collect-aros link script combines
# with a C harness (which owns AROS startup / argc / argv) into the
# `C:Feraille` command. See docs/features/aros-port.md and link-aros.sh.
[lib]
crate-type = ["staticlib"]

[dependencies]
# Not in [workspace.dependencies] — feraille-gpui is the leaf app crate;
# this wrapper is its only dependent.
feraille-gpui = { path = "../feraille-gpui" }
# getrandom's custom-backend hook type (the .cargo/config selects
# `getrandom_backend="custom"` for the AROS target; the final binary must
# provide __getrandom_v03_custom — ours rides posixc arc4random_buf).
getrandom = "0.3"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("aros"))']
