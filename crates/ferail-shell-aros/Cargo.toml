[package]
name = "ferail-shell-aros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AROS platform shell: Workbench, openurl, ASL, clipboard.device and DOS integration"
publish = false

[dependencies]
ferail-core.workspace = true
# compress_paths writes `.zip` archives: pure Rust, platform-neutral, the same
# implementation the Linux and Windows shells carry.
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("aros"))']
