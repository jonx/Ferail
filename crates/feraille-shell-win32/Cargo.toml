[package]
name = "feraille-shell-win32"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows shell integration: namespace, IContextMenu, drag-drop, change notifications"

[dependencies]
feraille-core.workspace = true

# compress_paths writes Explorer-style .zip archives. Pure-Rust, no
# extra C deps. Same major used elsewhere in the Rust ecosystem.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# Microsoft's official Win32 bindings. Features are pulled per-call-site
# rather than enumerated up-front; tighten / prune once the surface
# settles.
windows = { version = "0.58", features = [
    # show_alert → MessageBoxW
    "Win32_UI_WindowsAndMessaging",
    # system_is_dark → registry read
    "Win32_System_Registry",
    "Win32_Foundation",
    # copy_to_clipboard → Open/Set/Close clipboard + GlobalAlloc
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # fetch_quick_look_thumbnail → SHCreateItemFromParsingName +
    # IShellItemImageFactory + GDI GetDIBits
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    # IPreviewHandler fallback (preview_handler.rs)
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_Xps",
] }

[target.'cfg(windows)'.dev-dependencies]
# Used by examples/thumb.rs to dump the extracted thumbnail to disk
# so we can eyeball it without launching the GUI.
image = { version = "0.25", default-features = false, features = ["png"] }
