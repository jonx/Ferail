[package]
name = "feraille-shell-win32"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows shell integration: namespace, IContextMenu, drag-drop, change notifications"

[dependencies]
feraille-core.workspace = true

[target.'cfg(windows)'.dependencies]
# Microsoft's official Win32 bindings. Features are pulled per-call-site
# rather than enumerated up-front; tighten / prune once the surface
# settles.
windows = { version = "0.58", features = [
    # show_alert → MessageBoxW
    "Win32_UI_WindowsAndMessaging",
    # system_is_dark → registry read
    "Win32_System_Registry",
    "Win32_Foundation",
    # copy_to_clipboard → Open/Set/Close clipboard + GlobalAlloc
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
