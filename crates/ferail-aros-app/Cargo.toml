[package]
name = "ferail-aros-app"
version.workspace = true
license.workspace = true
repository.workspace = true
# Edition 2024 to match ferail-gpui.
edition = "2024"
rust-version.workspace = true
publish = false

# The AROS entry point: the `Ferail` command. A Rust `bin` linked through the
# crosstools clang's AROS driver (scripts/aros-cargo.sh): AROS's C start-up
# hands argc/argv to std and runs the constructors, and `main` boots the
# shared GUI in ferail-gpui. See docs/features/aros-port.md.
[[bin]]
name = "Ferail"
path = "src/main.rs"

[dependencies]
# Small objects from size-class slabs instead of the C library (exec pools
# behind a semaphore and Forbid/Permit on every call); see the crate.
aros-alloc = { path = "../aros-alloc" }
# No default features: the screenshot harness (gpui test-support) is a
# macOS/Windows capture path, and on AROS its proptest/tempfile tail has no
# platform arm. AROS runs are observed on the running system instead.
ferail-gpui = { path = "../ferail-gpui", default-features = false }

[build-dependencies]
cc = "1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("aros"))']
