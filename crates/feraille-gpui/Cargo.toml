[package]
name = "feraille-gpui"
version.workspace = true
license.workspace = true
# GPUI requires edition 2024 (and Rust >= 1.85). The rest of the
# workspace is on 2021 / 1.78 — we keep the new crate's edition
# explicit so the rest of the workspace doesn't have to bump.
edition = "2024"
rust-version = "1.85"
publish = false

# Phase 1 of the GPUI migration. Empty shell — opens a window with
# native chrome, sidebar + main panel scaffolding, no domain logic.
#
# This crate is parallel to `feraille-app`. Both compile and run
# during the migration. The cutover commit at end of Phase 6 deletes
# `feraille-app`, `feraille-render`, and `feraille-controls`.

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
# Phase 1 (next-level plan): bundle our own SVG icons alongside
# the upstream gpui-component icon pack. Same major as the upstream
# crate uses so we stay single-copy in the graph.
rust-embed = { version = "8.7", features = ["interpolate-folder-path", "include-exclude"] }
# Phase 5.b: file-system change events. notify ships its own
# platform-specific watcher (FSEvents on macOS, inotify on Linux,
# ReadDirectoryChangesW on Windows). Pinned to the same major as
# gpui-component's transitive use to keep one copy in the graph.
notify = "7.0"
# Used to build the smallvec ExternalPaths expects for OS drag-out.
smallvec = "1"
# Wraps RGBA byte buffers we pull from NSWorkspace into a Frame the
# gpui RenderImage type accepts. gpui-component pulls the same major
# transitively, so this stays single-copy in the graph.
image = { version = "0.25", default-features = false }

# Domain wiring. feraille-gpui consumes the domain layer the same
# way feraille-app did, through the same trait surface audited in
# Phase 2. All seven crates are verified clean (no transitive dep
# on feraille-render or feraille-controls); they link directly.
feraille-core.workspace = true
feraille-fs-native.workspace = true
# Harvest Stage 0: link the remaining domain crates. Even when
# their consumers haven't landed yet (e.g. feraille-meta is wired
# in Stage 1, disk-usage in Stage 7), declaring them here means a
# single `cargo check` from now on confirms the dep graph remains
# clean as the harvest proceeds.
feraille-design.workspace = true
feraille-meta.workspace = true
feraille-disk-usage.workspace = true
feraille-shell-mac.workspace = true

[dev-dependencies]
# Phase 2 isolation test still lives here. It now ALSO doubles as a
# guarantee that the domain types stay dyn-safe — Phase 4 relies on
# `Box<dyn FsBackend>` working.
feraille-core.workspace = true
feraille-fs-native.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "feraille-gpui"
path = "src/main.rs"

[[bin]]
name = "feraille"
path = "src/bin/feraille.rs"
