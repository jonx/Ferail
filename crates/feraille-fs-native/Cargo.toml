[package]
name = "feraille-fs-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform std::fs implementation of feraille-core::FsBackend"

[dependencies]
feraille-core.workspace = true
feraille-disk-usage.workspace = true
xxhash-rust.workspace = true
blake3.workspace = true

[target.'cfg(windows)'.dependencies]
# Win32 bindings for drive enumeration + volume info. Same version as
# feraille-shell-win32 to keep the dep graph tight.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    # GetLogicalDrives, GetDriveTypeW, GetVolumeInformationW, GetDiskFreeSpaceExW
    "Win32_Storage_FileSystem",
    # move_to_trash → SHFileOperationW, icons → SHGetFileInfoW
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # fetch_icon_rgba (icons.rs) needs CoInitializeEx
    "Win32_System_Com",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# getuid() for the per-volume `.Trashes/<uid>` path (trash_dirs).
libc = "0.2"
xattr = "1"
plist = "1"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSGeometry",
    "NSValue",
    "NSURL",
    "NSError",
    "NSFileManager",
    "NSArray",
    "NSDictionary",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSWorkspace",
    "NSImage",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSGraphics",
    "NSGraphicsContext",
] }
