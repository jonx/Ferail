# AROS build overrides — copy to `.cargo/config.toml` at the repo root.
#
#     cp packaging/aros/cargo-config-aros.toml .cargo/config.toml
#
# `.cargo/config.toml` is gitignored (per-machine config), which is exactly what
# these entries need to be: they point at **sibling checkouts** that only an
# AROS builder has. They used to live in the workspace `Cargo.toml`, where a
# missing sibling turned every clean clone — on every platform, including CI —
# into an instant manifest error rather than a merely AROS-less build.
#
# Cargo applies `[patch]` from this file exactly as it would from a manifest.
# Required checkout layout is documented in docs/features/aros-building.md
# § "Checkout layout (sibling paths are load-bearing)".

# gpui + gpui_platform come from the sibling zed fork checkout (same pinned rev
# 1d217ee as the workspace manifest, plus the new gpui_aros backend crate).
# On macOS/Windows/Linux the fork's code is byte-identical to the pinned rev,
# so this patch changes nothing off-AROS; gpui's intra-repo path deps (and
# gpui-component's gpui dep) all resolve into the fork automatically.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../zed-aros/crates/gpui" }
gpui_platform = { path = "../zed-aros/crates/gpui_platform" }

# gpui-component at the same pinned rev (a worktree of the local checkout at
# c112e7b, branch aros-port) with one delta: `smol` -> `async-channel` at its
# two channel-only call sites, keeping smol's async-io/rustix reactor (no
# AROS arm) out of the graph. Identical behavior on every target.
[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { path = "../gpui-component-aros/crates/ui" }
gpui-component-assets = { path = "../gpui-component-aros/crates/assets" }

[patch.crates-io]
# stacker has no AROS arm upstream (its C stack-growth probe assumes
# unix/windows); the zed fork vendors 0.1.23 with a no-op AROS fallback.
# Byte-identical behavior on every other target (same upstream source +
# an added cfg arm), so this patch is inert off-AROS.
stacker = { path = "../zed-aros/vendor-aros/stacker" }
# filetime (via notify) has unix/windows/wasm arms only; the vendored copy
# adds an AROS arm (std-Metadata reads, set-times unsupported). Same source
# otherwise — inert off-AROS.
filetime = { path = "../zed-aros/vendor-aros/filetime" }
