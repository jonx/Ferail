# Source overrides for the AROS cross-build. NOT a `.cargo/config.toml`.
#
# Passed explicitly by the AROS scripts and nothing else:
#
#     cargo --config packaging/aros/aros-patches.toml check --target ...aros.json
#
# That scoping is the point. `[patch]` is global to a build, so putting these
# in `.cargo/config.toml` would feed the sibling forks to the macOS, Windows and
# Linux builds on the same machine, release packaging included. Here they only
# reach AROS.
#
# **Paths below are relative to the PARENT of this file's directory**, i.e. to
# `packaging/`, not to `packaging/aros/` and not to the repo root. That is
# cargo's rule for config files (it assumes the usual `<root>/.cargo/` layout
# and resolves relative to `<root>`). So `../../aros-project/gpui-aros`
# is `~/Source/aros-project/gpui-aros` for a checkout at
# `~/Source/Ferail-aros`. Sibling layout: docs/features/aros-building.md
# § "Checkout layout".
#
# Every entry overrides a crates.io package with a fork of the *same version*
# the committed Cargo.lock resolves, so the override is never silently dropped
# (cargo does not downgrade or upgrade to a patch). The AROS scripts re-assert
# the pins that differ from what a host `cargo update` would pick (libc,
# getrandom 0.4).

[patch.crates-io]
# GPUI's platform crate: the published gpui-pre-platform 0.3.8 source plus one
# `target_os = "aros"` arm selecting `gpui_aros::ArosPlatform` (the Intuition /
# CyberGraphics / tiny-skia backend next to it). Nothing else in the gpui-pre
# 0.3.8 graph needs a fork for AROS.
gpui-pre-platform = { path = "../../aros-project/gpui-aros/crates/gpui_platform_aros" }

# gpui-kit at v0.7.1 with the narrow AROS delta: `async-channel` instead of the
# `smol` facade (smol's async-io reactor has no AROS arm) and no client-side
# window controls on the server-decorated Intuition window.
gpui-component = { path = "../../aros-project/gpui-component-aros-0.7.1/crates/component" }
gpui-base = { path = "../../aros-project/gpui-component-aros-0.7.1/crates/base" }
# Unchanged in the fork, but its workspace members reach them by path, and a
# second copy of the assets crate would clash on its `links` key.
gpui-kit-assets = { path = "../../aros-project/gpui-component-aros-0.7.1/crates/assets" }
gpui-component-macros = { path = "../../aros-project/gpui-component-aros-0.7.1/crates/component-macros" }

# The AROS crate store built by crates/store.py of pomaros/rust-aros: each
# crate is the crates.io package with its AROS patch. getrandom takes its
# getentropy() backend in its three lines, parking_lot_core the realtime-clock
# condvar. The cargo wrapper selects the native application libc 0.2.190,
# independently of std's locked libc; both bind to one native C provider.
# Only each entry's last path component matters: the wrapper looks it up in
# AROS_CRATE_STORE.
getrandom = { path = "../../aros-project/crate-store/getrandom-0.4.3" }
getrandom03 = { package = "getrandom", path = "../../aros-project/crate-store/getrandom-0.3.4" }
getrandom02 = { package = "getrandom", path = "../../aros-project/crate-store/getrandom-0.2.17" }
parking_lot_core = { path = "../../aros-project/crate-store/parking_lot_core-0.9.12" }

# Crates the GPUI graph pulls, from the same store:
# memmap2 takes its own unsupported-platform stub on AROS (no mmap; mapping
# fails with Unsupported, never a fake mapping); ctor and inventory place
# life-before-main constructors in `.init_array`, which collect-aros gathers
# into the INIT_ARRAY symbol set and autoinit runs at startup.
# backtrace: AROS links no unwinder (the std patch makes panics abort and its
# own backtrace a no-op); the crate's frame walk and symbolizer take their
# no-op arms as well.
backtrace = { path = "../../aros-project/crate-store/backtrace-0.3.76" }
memmap2 = { path = "../../aros-project/crate-store/memmap2-0.9.10" }
ctor = { path = "../../aros-project/crate-store/ctor-1.0.12" }
inventory = { path = "../../aros-project/crate-store/inventory-0.3.24" }
# SQLite (bundled by rusqlite): its unix VFS takes an AROS device or assign
# path as absolute instead of prefixing the current directory to it.
libsqlite3-sys = { path = "../../aros-project/crate-store/libsqlite3-sys-0.28.0" }
# The native SDK's system services: rustix and errno on the AROS C library,
# mio's readiness on the native poll, tempfile without unlink-while-open (an
# open AROS file cannot be deleted; its owner closes every handle first), and
# serde/serde_core serializing OsStr/OsString as bytes on AROS. rustix 0.38
# stays on crates.io: only host (Wayland) crates reach it.
rustix = { path = "../../aros-project/crate-store/rustix-1.1.4" }
errno = { path = "../../aros-project/crate-store/errno-0.3.14" }
mio = { path = "../../aros-project/crate-store/mio-1.2.1" }
tempfile = { path = "../../aros-project/crate-store/tempfile-3.27.0" }
serde = { path = "../../aros-project/crate-store/serde-1.0.228" }
serde_core = { path = "../../aros-project/crate-store/serde_core-1.0.228" }
