# Vendored copy of zed's `sum_tree` (Apache-2.0), with ONE delta: the GPL-3.0
# `ztracing` dependency and its nine use-sites are removed. See README.md here
# for why, and vendor/sum-tree/README.md for how to re-sync on a gpui bump.
#
# Deps below are pinned explicitly because the upstream manifest inherits them
# from zed's workspace (`heapless.workspace = true` etc.), which does not exist
# here. Versions match what Cargo.lock already resolved for the pinned gpui rev,
# so this introduces no new packages into the graph.

[package]
name = "sum_tree"
version = "0.1.0"
# 2024, not the workspace's 2021: upstream inherits zed's workspace edition and
# the source uses let-chains, which are 2024-only. Needs Rust >= 1.85, which is
# this workspace's MSRV anyway (ferail-gpui is already on edition 2024).
edition = "2024"
publish = false
license = "Apache-2.0"
description = "A sum tree data structure, a concurrency-friendly B-tree (vendored from zed, ztracing removed)"

[lib]
path = "src/sum_tree.rs"
doctest = false

[dependencies]
heapless = "0.9"
rayon = "1.8"
log = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
tracing = "0.1"
proptest = { version = "1", optional = true }

# Upstream also carries dev-dependencies (ctor, rand, proptest, zlog) for its
# own test suite. They are dropped: we do not run sum_tree's tests, and `zlog`
# is the other GPL-3.0 crate in this chain — keeping it, even as a
# dev-dependency, would leave a GPL edge in `cargo tree`.

[features]
test-support = ["proptest"]
